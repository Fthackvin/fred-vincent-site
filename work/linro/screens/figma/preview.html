<!doctype html>
<meta charset="utf-8">
<title>Linro — SVG exports, checked</title>
<!-- Renders the exports as plain images, which is the honest test: if a run
     of text is misplaced here it will be misplaced wherever it lands.

     One artefact belongs to this page and not to the files: an <img> cannot
     load a webfont, so these fall back to a system face and inline runs sit
     slightly apart. Figma has Inter, so they close up on import. -->
<body style="margin:0;background:#111;display:flex;flex-direction:column;gap:20px;padding:20px">
<img src="violations.svg" style="width:100%">
<img src="agent.svg" style="width:100%">
<img src="simulate.svg" style="width:100%">
</body>
